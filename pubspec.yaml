name: habit_monster
description: A gamified habit tracker for children with evolving creature companions.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3

  # Navigation
  go_router: ^13.2.2

  # UI / Animation
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  confetti: ^0.7.0

  # HTTP
  http: ^1.2.1

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/creatures/
